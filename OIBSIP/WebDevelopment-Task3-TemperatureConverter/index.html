<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temperature Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="converter-card">
        <div class="header-block">
          <p class="eyebrow">Temperature Utility</p>
          <h1>Temperature Converter</h1>
        </div>

        <div class="input-group">
          <label for="temperature">Enter temperature</label>
          <input id="temperature" type="number" step="any" placeholder="e.g. 25" />
          <small id="error-message" class="error-message" aria-live="polite"></small>
        </div>

        <div class="unit-row">
          <div class="field-group">
            <label for="input-unit">From unit</label>
            <select id="input-unit">
              <option value="celsius">Celsius (°C)</option>
              <option value="fahrenheit">Fahrenheit (°F)</option>
              <option value="kelvin">Kelvin (K)</option>
            </select>
          </div>
        </div>

        <button id="convert-btn" class="convert-btn" type="button">Convert</button>

        <div class="results-panel" aria-live="polite">
          <h2>Converted Results</h2>
          <div class="result-grid">
            <div class="result-item">
              <span class="result-label">Celsius</span>
              <strong id="celsius-result">--</strong>
            </div>
            <div class="result-item">
              <span class="result-label">Fahrenheit</span>
              <strong id="fahrenheit-result">--</strong>
            </div>
            <div class="result-item">
              <span class="result-label">Kelvin</span>
              <strong id="kelvin-result">--</strong>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
